<div style="font-family: Arial, sans-serif; max-width: 560px; margin: 0 auto; color: #292524; line-height: 1.6;">
  <h1 style="color: #78350f; font-size: 24px;">Reset your Mahogany Hotel password</h1>
  <p>We received a request to reset the password for <strong>{{ .Email }}</strong>.</p>
  <p><a href="{{ .ConfirmationURL }}" style="background: #78350f; border-radius: 8px; color: #ffffff; display: inline-block; padding: 12px 18px; text-decoration: none;">Choose a new password</a></p>
  <p>This secure link expires after the period configured for password recovery. If you did not request a reset, ignore this email.</p>
</div>
